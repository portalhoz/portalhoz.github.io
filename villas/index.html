<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Villas del Portal 3 · PortalHoz</title>
<meta name="description" content="Portal de Villas del Portal 3: reservas, portería, PQR y comunicados.">
<meta name="theme-color" content="#047857">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Villas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<style>
  /* App de PortalHoz para un conjunto: el portal (Apps Script) a pantalla completa, con ícono y sin la barra del navegador */
  :root { --verde: #047857; --fondo: #ffffff; --texto: #0f172a; --suave: #64748b; --borde: #e2e8f0; --aviso: #f0fdf4; }
  @media (prefers-color-scheme: dark) { :root { --fondo: #0f172a; --texto: #e2e8f0; --suave: #94a3b8; --borde: #334155; --aviso: #064e3b; } }
  html, body { margin: 0; height: 100%; background: var(--fondo); color: var(--texto); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #portal { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--fondo); }
  .pantalla { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: var(--fondo); z-index: 5; transition: opacity .3s; }
  .pantalla.oculta { opacity: 0; pointer-events: none; }
  .pantalla[hidden] { display: none; }
  .pantalla img { width: 96px; height: 96px; }
  .nombre { font-size: 20px; font-weight: 800; }
  .con { font-size: 12px; color: var(--suave); }
  .con b { color: var(--verde); }
  .girando { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--borde); border-top-color: var(--verde); animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .boton { background: var(--verde); color: #fff; border: 0; border-radius: 10px; padding: 12px 22px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .texto { max-width: 320px; color: var(--suave); font-size: 14px; line-height: 1.45; margin: 0; }
  /* Aviso para instalar (arriba, para no tapar la barra de pestañas del portal) */
  #instalar { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; align-items: center; gap: 10px;
              background: var(--aviso); border: 1px solid var(--verde); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 4px 16px rgba(15, 23, 42, .15); }
  #instalar[hidden], #avisos[hidden] { display: none; }
  #avisos { position: fixed; left: 8px; right: 8px; top: calc(8px + env(safe-area-inset-top, 0px)); z-index: 6; display: flex; align-items: center; gap: 10px;
            background: var(--aviso); border: 1px solid var(--verde); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 4px 16px rgba(15, 23, 42, .15); }
  #avisos span { flex: 1; min-width: 0; }
  #avisos button { border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--verde); padding: 6px; }
  #instalar img { width: 32px; height: 32px; flex-shrink: 0; }
  #instalar span { flex: 1; min-width: 0; }
  #instalar button { border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--verde); padding: 6px; }
  @media (prefers-reduced-motion: reduce) { .girando { animation-duration: 2s; } .pantalla { transition: none; } }
</style>
</head>
<body>
  <!-- Bienvenida mientras carga el portal -->
  <div id="bienvenida" class="pantalla" role="status" aria-live="polite">
    <img src="../assets/portalhoz-icono-512.png" alt="">
    <div class="nombre" id="nombreConjunto">Villas del Portal 3</div>
    <div class="girando" aria-hidden="true"></div>
    <div class="con">con <b>PortalHoz</b></div>
  </div>

  <!-- Sin internet -->
  <div id="sinConexion" class="pantalla" hidden>
    <img src="../assets/portalhoz-icono-512.png" alt="">
    <div class="nombre">Sin conexión</div>
    <p class="texto">Este celular no tiene internet. Revisa el wifi o los datos y vuelve a intentar.</p>
    <button type="button" class="boton" onclick="location.reload()">Reintentar</button>
  </div>

  <!-- Invitación a instalar (Android: botón; iPhone: cómo hacerlo) -->
  <!-- Activar las notificaciones de este celular (solo si el conjunto tiene el servicio) -->
  <div id="avisos" hidden>
    <span aria-hidden="true">🔔</span>
    <span id="avisosTexto">Activa los avisos para saber cuándo llega un pedido o entra tu visita.</span>
    <button type="button" id="avisosSi">Activar</button>
    <button type="button" id="avisosNo" aria-label="Cerrar">✕</button>
  </div>

  <div id="instalar" hidden>
    <img src="../assets/portalhoz-icono-192.png" alt="">
    <span id="instalarTexto">Instala la app de Villas en tu celular.</span>
    <button type="button" id="instalarSi" hidden>Instalar</button>
    <button type="button" id="instalarNo" aria-label="Cerrar">✕</button>
  </div>

  <iframe id="portal" title="Villas del Portal 3" allow="clipboard-write; web-share; camera" referrerpolicy="no-referrer-when-downgrade"></iframe>

<script>
  // ===== Lo único que cambia por conjunto =====
  const PORTAL = {
    nombre: 'Villas del Portal 3',
    corto: 'Villas',
    // Dirección de la implementación de Apps Script (Implementar → Administrar implementaciones → URL de la app web)
    url: 'https://script.google.com/macros/s/AKfycbzo63zWxa8WwbRZBXkRnk-9yG_qsGDuZrX03SLzdg27yrHkZa45gmWZH1kafI14dLa7XQ/exec'
  };

  const $ = id => document.getElementById(id);
  const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  $('nombreConjunto').textContent = PORTAL.nombre;

  function mostrarSinConexion() { $('bienvenida').hidden = true; $('sinConexion').hidden = false; }
  function quitarBienvenida() { const b = $('bienvenida'); b.classList.add('oculta'); setTimeout(() => { b.hidden = true; }, 350); }

  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(PORTAL.url)) {
    $('bienvenida').querySelector('.girando').remove();
    $('bienvenida').insertAdjacentHTML('beforeend', '<p class="texto">Falta configurar la dirección del portal.</p>');
  } else if (navigator.onLine === false) {
    mostrarSinConexion();
  } else {
    const f = $('portal');
    f.addEventListener('load', quitarBienvenida);
    setTimeout(quitarBienvenida, 15000);   // por si el navegador no avisa que terminó
    f.src = PORTAL.url;
  }
  window.addEventListener('online', () => { if (!$('sinConexion').hidden) location.reload(); });

  // ===== Instalar como app =====
  const instalada = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const yaCerro = () => leer('ph_instalar_cerrado') === '1';
  $('instalarNo').onclick = () => { $('instalar').hidden = true; guardar('ph_instalar_cerrado', '1'); };
  let pedido = null;
  // En Android solo Chrome arma la app con los servidores de Google para el Android actual.
  // Edge, Samsung, Opera y otros la arman para Android antiguo y Google Play Protect la bloquea como «app no segura».
  // Por eso «Instalar» solo se ofrece en Chrome; en los demás, un botón para abrir esta misma página en Chrome.
  const ua = navigator.userAgent;
  const esAndroid = /Android/i.test(ua);
  const esChromeAndroid = esAndroid && /Chrome\//.test(ua) && !/EdgA|SamsungBrowser|OPR|Opera|Firefox|FxiOS|YaBrowser|MiuiBrowser|HeyTapBrowser|UCBrowser|DuckDuckGo|; wv\)/i.test(ua);
  if (esAndroid && !esChromeAndroid && !instalada && !yaCerro()) {
    const enChrome = 'intent://' + location.host + location.pathname + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent('https://play.google.com/store/apps/details?id=com.android.chrome') + ';end';
    $('instalarTexto').textContent = 'Para instalar la app de ' + PORTAL.corto + ' en tu celular, ábrela en Chrome.';
    $('instalarSi').textContent = 'Abrir en Chrome';
    $('instalarSi').onclick = () => { location.href = enChrome; };
    $('instalarSi').hidden = false;
    setTimeout(() => { $('instalar').hidden = false; }, 2000);
  }
  // Android con Chrome: el navegador ofrece instalar; mostramos nuestro botón
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); pedido = e;
    if (instalada || yaCerro() || !esChromeAndroid && esAndroid || /iPhone|iPad|iPod/.test(ua)) return;
    $('instalarTexto').textContent = 'Instala la app de ' + PORTAL.corto + ': queda con su ícono en tu celular.';
    $('instalarSi').hidden = false; $('instalar').hidden = false;
  });
  if (!esAndroid || esChromeAndroid) $('instalarSi').onclick = async () => {
    if (!pedido) return;
    pedido.prompt();
    try { await pedido.userChoice; } catch (e) {}
    pedido = null; $('instalar').hidden = true;
  };
  window.addEventListener('appinstalled', () => { $('instalar').hidden = true; guardar('ph_instalar_cerrado', '1'); });
  // iPhone / iPad (Safari no tiene botón de instalar): explicar los dos toques
  const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (esIOS && !instalada && !yaCerro()) {
    $('instalarTexto').innerHTML = 'Para tenerla como app: toca <b>Compartir</b> <span aria-hidden="true">⬆️</span> y luego <b>«Agregar a inicio»</b>.';
    setTimeout(() => { $('instalar').hidden = false; }, 2500);
  }

  // ===== Espejo de la sesión (iPhone) =====
  // Safari borra lo que guarda el portal (va dentro de esta página, es «de terceros») al cerrar la app.
  // El portal nos manda copia de su sesión, documento recordado, tema y letra; aquí sí se conserva y se la devolvemos al abrir.
  // Solo se atiende al portal que está dentro de nuestro marco: otra página o ventana no puede pedir la sesión.
  const CLAVES_ESPEJO = ['vp3_sesion', 'ph_doc_recordado', 'ph_tema', 'ph_lectura'];
  const PREFIJO = 'espejo:' + PORTAL.corto + ':';
  function esDeNuestroPortal(origen) {
    const raiz = $('portal').contentWindow;
    if (!raiz || !origen) return false;
    const buscar = (w, nivel) => {
      if (w === origen) return true;
      if (nivel > 4) return false;
      try { for (let i = 0; i < w.frames.length; i++) if (buscar(w.frames[i], nivel + 1)) return true; } catch (e) {}
      return false;
    };
    return buscar(raiz, 0);
  }
  window.addEventListener('message', e => {
    const d = e.data;
    if (!d || d.portalhoz !== 1 || !/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !esDeNuestroPortal(e.source)) return;
    if (d.tipo === 'pedir') {
      const datos = {};
      CLAVES_ESPEJO.forEach(k => { const v = leer(PREFIJO + k); if (v !== null) datos[k] = v; });
      portalVentana = e.source; portalOrigen = e.origin;
      const msg = { portalhoz: 1, tipo: 'espejo', datos };
      const tk = leer(LS_PUSH);
      if (tk) { msg.pushToken = tk; msg.plataforma = plataformaPush(); }
      e.source.postMessage(msg, e.origin);
    } else if (d.tipo === 'guardar' && CLAVES_ESPEJO.indexOf(d.clave) !== -1 && typeof d.valor === 'string' && d.valor.length < 8000) {
      guardar(PREFIJO + d.clave, d.valor);
    } else if (d.tipo === 'borrar' && CLAVES_ESPEJO.indexOf(d.clave) !== -1) {
      try { localStorage.removeItem(PREFIJO + d.clave); } catch (x) {}
    }
  });

  // ===== Notificaciones push (Firebase) =====
  // La persona toca «Activar»: el celular da permiso, Firebase entrega un token y se le pasa al portal, que lo
  // guarda a nombre de quien tiene la sesión. En iPhone solo funciona con la app instalada (Compartir → Agregar a inicio).
  const FIREBASE = {"apiKey":"AIzaSyATzX3vYeqccR35srcw2-4wlRG8nMTBMfs","authDomain":"portalhoz.firebaseapp.com","projectId":"portalhoz","messagingSenderId":"272717077640","appId":"1:272717077640:web:95bdcd0692437a4065d33d","vapidKey":"BBG9WAgRLivz_EfX7hAhuFZQFHNjWQvGSLBkowCD8jbTgDoqpE8BjG6Wx599qjg8-Oeme-9AgbRXpaXfVkd7OF0"};   // vacío: el conjunto no tiene el servicio de notificaciones
  const LS_PUSH = 'push:' + PORTAL.corto;
  let portalVentana = null, portalOrigen = '';
  function plataformaPush() { return esAndroidPush() ? 'Android' : (/iPhone|iPad|iPod/.test(navigator.userAgent) ? 'iPhone' : 'Otro'); }
  function esAndroidPush() { return /Android/i.test(navigator.userAgent); }
  const pushPosible = () => !!(FIREBASE && FIREBASE.apiKey && 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window);
  function avisarPortalPush(tk) { if (portalVentana && portalOrigen) { try { portalVentana.postMessage({ portalhoz: 1, tipo: 'push', token: tk, plataforma: plataformaPush() }, portalOrigen); } catch (e) {} } }
  function cargarScript(src) { return new Promise((ok, mal) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = mal; document.head.appendChild(s); }); }
  async function tokenPush() {
    if (!window.firebase || !window.firebase.messaging) {
      await cargarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await cargarScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js');
    }
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE);
    const reg = await navigator.serviceWorker.ready;
    return firebase.messaging().getToken({ vapidKey: FIREBASE.vapidKey, serviceWorkerRegistration: reg });
  }
  async function activarAvisos() {
    $('avisos').hidden = true;
    try {
      const permiso = await Notification.requestPermission();
      if (permiso !== 'granted') { guardar('ph_avisos_cerrado', '1'); return; }
      const tk = await tokenPush();
      if (!tk) return;
      guardar(LS_PUSH, tk);
      avisarPortalPush(tk);
    } catch (e) { /* sin avisos: el portal sigue funcionando igual */ }
  }
  $('avisosSi').onclick = activarAvisos;
  $('avisosNo').onclick = () => { $('avisos').hidden = true; guardar('ph_avisos_cerrado', '1'); };
  if (pushPosible()) {
    if (Notification.permission === 'granted') {
      // Ya activados: se confirma el token (Firebase lo cambia de vez en cuando) y se avisa al portal si cambió
      window.addEventListener('load', () => setTimeout(async () => {
        try { const tk = await tokenPush(); if (tk && tk !== leer(LS_PUSH)) { guardar(LS_PUSH, tk); avisarPortalPush(tk); } } catch (e) {}
      }, 3000));
    } else if (Notification.permission !== 'denied' && leer('ph_avisos_cerrado') !== '1' && (instalada || !/iPhone|iPad|iPod/.test(navigator.userAgent))) {
      // Se ofrece después de la invitación a instalar (nunca las dos a la vez)
      setTimeout(() => { if ($('instalar').hidden) $('avisos').hidden = false; }, 6000);
    }
  }


  // ===== Trabajador: abrir sin internet con el aviso de «Sin conexión» =====
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
